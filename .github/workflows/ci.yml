name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.9"
          - "3.12"
          - "3.14"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          check-latest: false

      - name: Compile Python sources
        run: python -m compileall -q scripts tests

      - name: Run unit and repository-policy tests
        run: python -m unittest discover -s tests -v

      - name: Scan repository content for sensitive material
        run: python scripts/recovery_audit.py scan-sensitive .

      - name: Verify repository manifest round trip
        env:
          MANIFEST_PATH: ${{ runner.temp }}/codex-migration-recovery.jsonl
        run: |
          python scripts/recovery_audit.py hash-tree . --output "$MANIFEST_PATH"
          python scripts/recovery_audit.py verify-manifest . --manifest "$MANIFEST_PATH"
